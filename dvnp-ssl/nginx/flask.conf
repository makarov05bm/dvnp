map $uri $mappocallow {
  /map-poc/private   0;
  /map-poc/secret     0;
  /map-poc/public     1;
}

map $http_x_forwarded_host $fetch_host {
    default $http_x_forwarded_host;
    ""      flask:7000;
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m use_temp_path=off;

#~~~ Log Configuration ~~~#
log_format portal_logs '$remote_addr - $http_user_agent - $request_uri';
#~~~ ================= ~~~#

server {
    listen 443 ssl;
    server_name www.skyblue.com;

    ssl_certificate /etc/ssl/certs/skyblue.com.pem;
    ssl_certificate_key /etc/ssl/certs/skyblue.com-key.pem;

    root /var/www/main/html;
    index index.html index.htm index.nginx-debian.html;

    location / {
      proxy_pass http://127.0.0.1:80$document_uri;
      proxy_set_header Host $host;
    }
}

server {
  listen 80 default_server;

  #~~~ Server Configurations ~~~#
  server_name portal.skyblue.com;
  server_tokens off;
  resolver 127.0.0.11 ipv6=off;
  error_page 500 /error.html;
  error_page 404 /404.html;
  # proxy_intercept_errors set to "off" allows proxy_pass to reflect backend errors to client
  proxy_intercept_errors on;
  real_ip_header X-Forwarded-For;
  merge_slashes off;
  access_log /var/log/nginx/access_portal.log portal_logs;
  #~~~ ===================== ~~~#

  #~~~ Global Response Headers ~~~#
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'";
  add_header Referrer-Policy origin;
  #~~~ ============== ~~~#

  #~~~ Global Proxy Headers ~~~#
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Host $host;
  #~~~ ============= ~~~#

  #~~~ Server Root Configurations ~~~#
  # Primary reverse proxy entry point for the main application
  location / {
    proxy_pass http://flask:7000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_cache_bypass $http_upgrade;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Localized entry point, kept for older clients using HTTP/1.0
  location /en-us/ {
  	proxy_pass http://flask:7000/;
    proxy_http_version 1.0;
    proxy_set_header Connection 'close';
  }
  #~~~ ========================== ~~~#


  # User-uploaded data files, served internally only via redirect from the app
  location /protected/user-data/ {
  	internal;
  	alias /var/www/user-data/;
  }

  # Generic internal routing helper for backend service calls
  location ~ /matchall/(.*) {
    proxy_pass http://flask:7000/$1;
    proxy_redirect off;
  }

  # Restricted debug/monitoring endpoint, internal network only
  location /internal/debug {
    set $trusted 0;
    if ($http_x_forwarded_for ~* "^10\.") { set $trusted 1; }
    if ($trusted = 0) { return 403; }

    add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
    proxy_pass http://flask:7000;
  }

  # Admin panel access, gated behind basic auth plus a backend-issued session cookie
  location /admin/panel {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    auth_request /set_admin_session;
    auth_request_set $session_cookie $upstream_http_set_cookie;

    # send cookie to client
    add_header Set-Cookie $session_cookie always;

    # send cookie to upstream
    proxy_set_header Cookie "$session_cookie";

    proxy_pass http://flask:7000/admin;
  }

  # Internal sub-request used by auth_request above to mint the admin session
  location = /set_admin_session {
    internal;
    proxy_pass http://flask:7000/set_admin_session;
  }

  # Session info endpoint, with CORS enabled for approved partner subdomains
  location /account/session {
    if ($http_origin ~* ^https://([a-zA-Z0-9-]+\.)*skyblue\.com) {
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    proxy_pass http://flask:7000/account/session;
  }

  # File upload endpoint
  location /upload {
    limit_except POST {
      deny all;
    }

    client_max_body_size 0;
    proxy_pass http://flask:7000/upload;
  }


  #~~~ Static Assets ~~~#
  # Cached static asset delivery
  location ~* \.(css|js|html|json)$ {
    access_log off;
    proxy_cache static_cache;
    proxy_cache_valid 200 60m;
    proxy_cache_key $scheme$host$request_uri;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://flask:7000;
  }

  # Redirects to versioned asset buckets on S3 (ap-northeast-1)
  location ~ ^/s3/ne-1/assets-([0-9]+)/([^s]+)$ {
    access_log off;
    proxy_cache static_cache;
    proxy_cache_valid 200 30m;
    proxy_cache_key $scheme$host$request_uri;
    add_header X-Cache-Status $upstream_cache_status always;
    return 301 https://s3-ap-northeast-1.amazonaws.com/skyblue-assets$1/$2;
  }

  # Redirects to GCS-hosted assets for global CDN distribution
  location ~ /gcs/global/assets/([^/]+)/(.*)$ {
    access_log off;
    return 301 https://storage.googleapis.com/$1/$2;
  }

  # Static asset delivery backed by an S3 bucket
  location ~ /s3/static/([^/]*/[^/]*)? {
    access_log off;
    proxy_pass https://s3-eu-west-1.amazonaws.com/skyblue-prod/$1.html;
  }
  #~~~ ============= ~~~#


  #~~~ Access Controls ~~~#
  # Admin routes are not served directly on the main vhost
  location = /admin {
      deny all;
  }

  location = /admin/ {
      deny all;
  }

  # Sensitive test pages, blocked on this vhost
  location ~ ^/(secret|private|topsecret) {
    deny all;
  }

  # Access-controlled proof-of-concept routes, gated via the map above
  location /map-poc/ {
  	if ($mappocallow = 0) {return 403;}

  	proxy_pass http://flask:7000/;
  }
  #~~~ =============== ~~~#

  # Shareable incident/status preview links, cached for performance
  location /preview-link {
    proxy_pass http://flask:7000/preview-link;
    proxy_cache static_cache;
    proxy_cache_valid 200 10m;
    proxy_cache_key $scheme$host$request_uri;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  # Internal application assets
  location /assets {
    proxy_pass http://flask:7000/assets;
  }


  #~~~ ERRORS ~~~#
  location = /error.html {
    internal;
    default_type text/html;
    return 500 "<h1>Something went wrong.</h1>";
  } 

  location = /404.html {
    internal;
    default_type text/html;
    return 404 "<h1>404 - Page Not Found.</h1>";
  }
  #~~~ ====== ~~~#

  location /hi {
    return 200 "hello";
  }

}

server {
  listen 80;

  server_name sandbox-dev-001.skyblue.com;

  #~~~ Global Proxy Headers ~~~#
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Host $host;
  #~~~ ============= ~~~#


  # Root directory for this sandbox instance
  location / {
    root /var/www/dev/html;
  }

  location /v1/login {
    proxy_pass http://flask-2:3000/v1/login;
  }

  location /ssh_keys {
    proxy_pass http://flask-2:3000/ssh_keys;
  }

  location /api/ssh_keys {
    proxy_pass http://flask-2:3000/api/ssh_keys;
  }

  # Maintenance page assets for this sandbox instance
  location ^~ /maintenance/ {
    root /var/www/dev;
  }

  # Block access to common backup/config file extensions
  location ~* ^/.*\.(bak|old|swp|orig|sh|sql)$ {
    deny all;
  }

  # Log viewer for the portal vhost, requires authentication
  location /logs {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://flask-2:3000/logs;
  }

  # Server status page for monitoring
  location /nginx_status {
    stub_status;
  }
}

server {
  listen 80;

  server_name sandbox-dev-002.skyblue.com;

  # This instance has been superseded — all traffic redirects to the main domain
  location / {
    proxy_ssl_verify on;
    rewrite ^/(.*)$ https://skyblue.com$1 permanent;
  }

  location /docs {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://flask-2:3000/docs;
  }

  location /docs/audit-report {
      proxy_pass http://flask-2:3000/docs/audit-report;
  }

  location /repo-list {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://flask-2:3000/repo-list;
  }

  # Administrative endpoint — internal network or valid credentials required
  location /dev-admin {
    satisfy any;

    allow 172.16.0.0/12;
    deny all;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://flask-2:3000/admin;
  }

  # Diagnostic endpoint — reports the client address as seen by nginx
  location /whoami {
    return 200 "$remote_addr\n";
  }
}

server {
  listen 80;

  server_name attacker.skyblue.com;

  root /var/www/attacker;
  index index.html index.htm index.nginx-debian.html;

  location / {
    try_files $uri $uri/ =404;
  }
}