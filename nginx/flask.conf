# Default value missing
map $uri $mappocallow {
  # default 0;
  /map-poc/private   0;
  /map-poc/secret     0;
  /map-poc/public     1;
}

map $http_x_forwarded_host $fetch_host {
    default $http_x_forwarded_host;
    ""      flask:7000;   # legitimate default backend when no header is sent
}

proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m use_temp_path=off;

#~~~ Log Configuration ~~~#
# Log injection can lead to XSS and others
#   GET / HTTP/1.1
#   Host: 192.168.100.93:8080
#   User-Agent: <script>alert(1)</script>
log_format portal_logs '$remote_addr - $http_user_agent - $request_uri';
#~~~ ================= ~~~#

server {
  listen 80 default_server;

  #~~~ Server Configurations ~~~#
  server_name portal.skyblue.com;
  server_tokens off;
  resolver 127.0.0.11 ipv6=off;
  error_page 500 /error.html;
  error_page 404 /404.html;
  # proxy_intercept_errors set to "off" allows proxy_pass to reflect backend errors to client
  proxy_intercept_errors on;
  real_ip_header X-Forwarded-For;
  merge_slashes off;
  access_log /var/log/nginx/access_portal.log portal_logs;
  #~~~ ===================== ~~~#

  #~~~ Global Response Headers ~~~#
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'";
  add_header Referrer-Policy origin;
  #~~~ ============== ~~~#

  #~~~ Global Proxy Headers ~~~#
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Host $host;
  #~~~ ============= ~~~#


  #~~~ Server Root Configurations ~~~#
  # will take precedance over /assets/ and as it has no uri component, the path will not be normalized
  # (in case of path traversal), leading to LFI in Flask's /assets/<path:req_path>'
  location / {
    proxy_pass http://flask:7000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_cache_bypass $http_upgrade;
    # This should be used globally
    # Leads to forged X-Forwarded-For, as the backend app skips 1, and the proxy is not adding
    # to the X-Forwarded-For array at all
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Alternative root, with http 1.0, and connetion "close"
  location /en-us/ {
  	proxy_pass http://flask:7000/; # the slash at the end omits /en-us/, taking only what comes after it
    proxy_http_version 1.0;
    proxy_set_header Connection 'close';
  }
  #~~~ ========================== ~~~#


  # can be accessed via http://127.0.0.1:8080/blog/download?file=customer_data.csv
  # path traversal possible
  location /protected/user-data/ {
  	internal;
  	alias /var/www/user-data/;
  }

  # SSRF via http://192.168.100.93:8080/matchall-2:3000/
  location ~ /matchall/(.*) {
    proxy_pass http://flask:7000/$1;
    proxy_redirect off;
  }

  # Accessible by using X-Forwarded-For: 10.2.2.2, with missing use of proxy_set_header X-Forwarded-For
  location /internal/debug {
    set $trusted 0;
    # X-Forwarded-For sent to the proxy can be easily forged bythe client
    if ($http_x_forwarded_for ~* "^10\.") { set $trusted 1; }
    if ($trusted = 0) { return 403; }

    # Using add_header in a nested level causes all inherited headers
    # to be removed from response for this endpoint
    add_header Cache-Control "no-cache, no-store, max-age=0, must-revalidate" always;
    proxy_pass http://flask:7000;
  }

  location /admin/panel {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    auth_request /set_admin_session;
    auth_request_set $session_cookie $upstream_http_set_cookie;

    # send cookie to client
    add_header Set-Cookie $session_cookie always;

    # send cookie to upstream
    proxy_set_header Cookie "$session_cookie";

    proxy_pass http://flask:7000/admin;
  }

  location = /set_admin_session {
    internal;
    proxy_pass http://flask:7000/set_admin_session;
  }

  # CORS due to missing trailing $ in the regex
  location /account/session {
    if ($http_origin ~* ^https://([a-zA-Z0-9-]+\.)*skyblue\.com) {
        add_header 'Access-Control-Allow-Origin' "$http_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
    }

    proxy_pass http://flask:7000/account/session;
  }

  # Container DoS by coninuosly uploading huge data streams
  location /upload {
    limit_except POST {
      deny all;
    }

    # 0 = no limit at all
    client_max_body_size 0;
    proxy_pass http://flask:7000/upload;
  }


  #~~~ Statis Assets ~~~#
  # NGINX strips query params when matching against $uri
  # so, cache deception by injecting a trailing ?foo=bar.js does not work
  location ~* \.(css|js|html|json)$ {
    access_log off;
    proxy_cache static_cache;
    proxy_cache_valid 200 60m;
    # note: no cookie/session in the key
    proxy_cache_key $scheme$host$request_uri;
    add_header X-Cache-Status $upstream_cache_status always;
    proxy_pass http://flask:7000;
  }

  # Open redirect by registering a bucket named skyblue-assets99999999 or any random trailing number
  location ~ ^/s3/ne-1/assets-([0-9]+)/([^s]+)$ {
    access_log off;
    proxy_cache static_cache;
    proxy_cache_valid 200 30m;
    proxy_cache_key $scheme$host$request_uri;
    add_header X-Cache-Status $upstream_cache_status always;
    return 301 https://s3-ap-northeast-1.amazonaws.com/skyblue-assets$1/$2;
  }

  # Open redirect to an malicious bucket, potentially hosting html (impact: phishing)
  # accountname, container, and blobs are all user-controlled
  location ~ /gcs/global/assets/([^/]+)/(.*)$ {
    access_log off;
    return 301 https://storage.googleapis.com/$1/$2;
  }

  # location ~ /az/assets/([^/]*/[^/]*)? {
  #   proxy_pass https://sbt.blob.core.windows.net/storyboards/$1.html;
  # }

  # HTTP splitting
  # Bucket is fixed, to bypass, we abuse HTTP spliting
  # XSS and others by hosting poc in a bucket you control, so /skyblue-assets, only becomes a container
  # inside attacker-controlled bucket
  # GET /s3/static/xss.html%20HTTP/1.1%0d%0aHost:s1img%0d%0a%0d%0a HTTP/1.1
  # PoC: /s3/static/bootstrap-theme.css%20HTTP/1.1%0d%0aHost:scmweb%0d%0a%0d%0a (proxy_pass https://s3-eu-west-1.amazonaws.com/css/$1.html;)
  # Host: skyblue.com:8080
  location ~ /s3/static/([^/]*/[^/]*)? {
    access_log off;
    # missing proxy_ssl_verify on;
    proxy_pass https://s3-eu-west-1.amazonaws.com/skyblue-prod/$1.html;
  }
  #~~~ ============= ~~~#


  #~~~ Access Controls ~~~#
  # HTTP Desync Bypass via /admin\x85 or /admin\xA0
  location = /admin {
      deny all;
  }

  # HTTP Desync Bypass via /admin/\x85 or /admin/\xA0
  location = /admin/ {
      deny all;
  }

  # bypass: /en-us/secret /en-us/private /en-us/topsecret
  # Exploitable due to the permissive alternative root
  location ~ ^/(secret|private|topsecret) {
    deny all;
  }

  # /map-poc/topsecret bypassable as it's not present in the map
  # /map-poc/private can be bypassed as well when merge_slashes is off /map-poc//private (with missing default)
  location /map-poc/ {
  	if ($mappocallow = 0) {return 403;}

  	proxy_pass http://flask:7000/;
  }
  #~~~ =============== ~~~#


  # Host header injection
  # GET /redirect HTTP/1.1
  # Host: skyblue.com:8080
  # X-Forwarded-Host: flask-2:3000/admin   |    X-Forwarded-Host: flask:7000/admin
  # location /webhooks/verify {
  #     # proxy_set_header Host $http_x_forwarded_host;
  #     # proxy_ssl_server_name on;
  #     # proxy_pass https://$http_x_forwarded_host/; # Slash at the end so `/redirect` is not appended

  #   proxy_set_header Host $fetch_host;
  #   proxy_ssl_server_name on;
  #   proxy_pass https://$fetch_host/;  # trailing slash so /fetch is not appended

  #   proxy_cache static_cache;
  #   proxy_cache_valid 200 10m;
  #   # Cache key deliberately omits Host / X-Forwarded-Host -- this is
  #   # the root cause. Two requests to the same URI + query string share
  #   # one cache entry regardless of which backend actually produced it.
  #   proxy_cache_key $scheme$request_uri;
  #   add_header X-Cache-Status $upstream_cache_status always;
  # }

  location /preview-link {
    proxy_pass http://flask:7000/preview-link;
    proxy_cache static_cache;
    proxy_cache_valid 200 10m;
    proxy_cache_key $scheme$host$request_uri;
    add_header X-Cache-Status $upstream_cache_status always;
  }

  # http://192.168.100.93:8080/assets/../////sensitive/aws.key
  # Explitable due to merge_slashes off
  location /assets {
    proxy_pass http://flask:7000/assets;
  }


  #~~~ ERRORS ~~~#
  location = /error.html {
    internal;
    default_type text/html;
    return 500 "<h1>Something went wrong.</h1>";
  } 

  location = /404.html {
    internal;
    default_type text/html;
    return 404 "<h1>404 - Page Not Found.</h1>";
  }
  #~~~ ====== ~~~#

}

server {
  listen 80;

  server_name sandbox-dev-001.skyblue.com;

  # / being server from /var/www/dev/html does not mean all other endpoints
  # are restricted to only this level and below
  location / {
    root /var/www/dev/html;
  }

  # unsafe use of ^~
  location ^~ /maintenance/ {
    root /var/www/dev;
  }

  # intended to 403 any request trying to fetch files with the below extenstions
  # however, the above location block makes any request starting
  # with /maintenance neglect any further regex checks
  # PoC: http://192.168.100.93:8080/maintenance/deploy.sh ==> 200 ok
  # Devs get tricked when they try /anything.sh and it returns 403
  location ~* ^/.*\.(bak|old|swp|orig|sh|sql)$ {
    deny all;
  }

  # watch logs of portal
  # unauthenticated Log Injection can lead to XSS
  location /logs {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://flask-2:3000/logs;
  }

  # Exposed NGINX Status
  location /nginx_status {
    stub_status;
  }
}

server {
  listen 80;

  server_name sandbox-dev-002.skyblue.com;

  #Open redirect due to matching the /, making $1 be equal to whatever is after the /
  # browse to "http://sandbox-dev-002.skyblue.com:8080/evil.com"
  location / {
    proxy_ssl_verify on;
    rewrite ^/(.*)$ https://skyblue.com$1 permanent;
  }

  location /docs {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://flask-2:3000/docs;
  }

  # More specific location = higher match priority, and it forgot to inherit auth_basic
  location /docs/audit-report {
      proxy_pass http://flask-2:3000/docs/audit-report;
  }

  # Missing rate limiting, allows credential brute-force
  location /repo-list {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://flask-2:3000/repo-list;
  }

  location /dev-admin {
    satisfy any;

    # wrong trust boundary assuming that remote client IP will be refleced here
    # Host -> Docker runtime -> NAT -> NGINX ==> Remote IP always in 172.16.0.0/12
    allow 172.16.0.0/12;
    deny all;

    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_pass http://flask-2:3000/admin;
  }

  location /whoami {
    return 200 "$remote_addr\n";
  }
}